<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מרחב אינטראקטיבי: עקרונות גבולות בריאים וערך עצמי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('intro');
            const [selectedActivity, setSelectedActivity] = React.useState(null);
            const [activeGameSubTab, setActiveGameSubTab] = React.useState('hub');
            
            // Wall / Hangman state
            const wallWords = [
                { word: 'הקשבה', hint: 'מה שאנחנו צריכים לעשות כשהמורה או חבר מדברים בשיעור', category: 'בית ספר וכיתה' },
                { word: 'מרחב אישי', hint: 'המרחק הפיזי סביב הגוף שלי, שאף אחד לא אמור להיכנס אליו בלי רשותי', category: 'בית ספר וכיתה' },
                { word: 'סבלנות', hint: 'התכונה שנעזרים בה כשצריך לחכות בתור או להרים יד ולחכות שיקראו בשמנו', category: 'בית ספר וכיתה' },
                { word: 'בקשת רשות', hint: 'שתי מילים שחובה להגיד לפני שלוקחים משהו שלא שייך לנו', category: 'בית ספר וכיתה' },
                { word: 'חברות', hint: 'קשר טוב בין ילדים, שמבוסס על כבוד הדדי ולא חוצה גבולות של פגיעה או העלבה', category: 'בית ספר וכיתה' },
                { word: 'פרטיות', hint: 'הזכות של אבא, אמא או האחים שלי להיות לבד בחדר שלהם בלי שיפריעו להם', category: 'בית ומשפחה' },
                { word: 'חוקי הבית', hint: 'הכללים שנקבעו יחד עם ההורים כדי שהבית יהיה מסודר, בטוח ונעים לכולם', category: 'בית ומשפחה' },
                { word: 'זמן מסך', hint: 'הגבול שמגדיר כמה שעות ביום מותר לנו להיות מול הטאבלט, הטלוויזיה או הטלפון', category: 'בית ומשפחה' }
            ];
            const [wallIndex, setWallIndex] = React.useState(0);
            const [guessedLetters, setGuessedLetters] = React.useState([]);
            const [wallMistakes, setWallMistakes] = React.useState(0);

            const currentWordObj = wallWords[wallIndex];
            const handleLetterGuess = (letter) => {
                if (guessedLetters.includes(letter)) return;
                setGuessedLetters([...guessedLetters, letter]);
                if (!currentWordObj.word.includes(letter)) {
                    setWallMistakes(prev => prev + 1);
                }
            };

            const resetWallGame = () => {
                setGuessedLetters([]);
                setWallMistakes(0);
                setWallIndex((prev) => (prev + 1) % wallWords.length);
            };

            // Sorting Game State
            const sortingCardsData = [
                { text: 'לבקש רשות מהחבר לפני שלוקחים לו משהו מהשולחן', category: 'inside' },
                { text: 'להתפרץ לדברי המורה בזמן שהיא מסבירה את החומר', category: 'outside' },
                { text: 'לשחק בטלפון הנייד מתחת לשולחן בזמן השיעור', category: 'outside' },
                { text: 'לעמוד בתור לקפיטריה בלי לדחוף או לעקוף', category: 'inside' },
                { text: 'להמשיך להציק לחבר אחרי שהוא אמר בבירור "די, תפסיק!"', category: 'outside' },
                { text: 'להרים יד ולחכות שיקראו בשמי לפני שאני עונה', category: 'inside' }
            ];
            const [sortingIndex, setSortingIndex] = React.useState(0);
            const [sortingScore, setSortingScore] = React.useState(0);
            const [sortingTimer, setSortingTimer] = React.useState(60);
            const [sortingActive, setSortingActive] = React.useState(false);
            const [sortingFeedback, setSortingFeedback] = React.useState(null);

            React.useEffect(() => {
                let interval = null;
                if (sortingActive && sortingTimer > 0) {
                    interval = setInterval(() => setSortingTimer(prev => prev - 1), 1000);
                } else if (sortingTimer === 0) {
                    setSortingActive(false);
                }
                return () => clearInterval(interval);
            }, [sortingActive, sortingTimer]);

            const handleSortChoice = (choice) => {
                if (!sortingActive) return;
                const currentCard = sortingCardsData[sortingIndex % sortingCardsData.length];
                if (choice === currentCard.category) {
                    setSortingScore(prev => prev + 1);
                    setSortingFeedback({ correct: true, text: 'כל הכבוד! תשובה נכונה.' });
                } else {
                    setSortingTimer(prev => Math.max(0, prev - 3));
                    setSortingFeedback({ correct: false, text: 'טעות! הזמן התקצר ב-3 שניות.' });
                }
                setTimeout(() => {
                    setSortingFeedback(null);
                    setSortingIndex(prev => prev + 1);
                }, 800);
            };

            // Wheel of Fortune / Dilemmas state
            const wheelDilemmas = [
                {
                    title: 'דילמת רכוש וחפצים',
                    situation: 'חזרת מההפסקה וגילית שחבר מהכיתה לקח לך את הטושים החדשים מהשולחן בלי לבקש רשות.',
                    options: [
                        { text: 'לחטוף לו את הטושים מהיד ולצעוק עליו בפני כולם.', correct: false, feedback: '🔴 חציית גבול! תוקפנות יוצרת עימות.' },
                        { text: 'לגשת אליו ולומר ברוגע: "הטושים האלו שלי, בבקשה תחזיר לי אותם".', correct: true, feedback: '🟢 הצבת גבול מכבדת ואסרטיבית!' }
                    ]
                },
                {
                    title: 'דילמת המרחב האישי',
                    situation: 'בזמן העמידה בתור לשיעור ספורט, ילד עומד קרוב מדי אליך ונצמד אליך למרות שלא נעים לך.',
                    options: [
                        { text: 'להסתובב אליו, לעשות צעד אחור ולומר: "אתה עומד קרוב מדי וזה מפריע לי".', correct: true, feedback: '🟢 הצבת גבול מכבדת ובריאה!' },
                        { text: 'לדחוף אותו חזרה חזק כדי שילמד לקח.', correct: false, feedback: '🔴 חציית גבול ותגובה פיזית.' }
                    ]
                }
            ];
            const [currentWheelIndex, setCurrentWheelIndex] = React.useState(0);
            const [wheelResult, setWheelResult] = React.useState(null);

            // Cards state
            const [currentCardIndex, setCurrentCardIndex] = React.useState(0);
            const [isFlipped, setIsFlipped] = React.useState(false);

            // 15 Comprehensive Activities Data
            const activitiesList = [
                { id: 1, title: 'מיפוי הקול הפנימי', story: 'דנה יושבת בחדר ומרגישה שחברה מבקשת ממנה שוב להכין את העבודה במקומה...', question: 'אילו קולות פנימיים עולים בך?', activity: 'זיהוי מחשבות מעכבות.', instructions: ['חלוקה לשני טור: קול מרצה מול קול בריא', 'רישום 3 משפטים', 'ניסוח מחדש בצורה מעצימה'] },
                { id: 2, title: 'משחק תפקידים: הבקשה והסירוב', story: 'תומר ניגש לרוני ומבקש ממנו את המפתחות למשחק החדש...', question: 'איך אומרים לא בלי לפגוע?', activity: 'סימולציית זוגות.', instructions: ['חלוקה לזוגות', 'תרגול אמירת לא שקטה', 'החלפת תפקידים'] },
                { id: 3, title: 'נוסחת שלושת השלבים בפעולה', story: 'שירה מתקשה לסרב כשמבקשים עזרה ברגע האחרון...', question: 'כיצד שילוב אמפתיה משנה את האווירה?', activity: 'תרגול נוסחת 3 השלבים.', instructions: ['אמפתיה', 'גבול ברור', 'הצעה חלופית'] },
                { id: 4, title: 'סולם המחירים הרגשיים', story: 'לכל פעולה יש מחיר רגשי וגופני כשמוותרים על הגבולות.', question: 'מה המחיר שאתה משלם?', activity: 'דירוג מצבים בסולם חומרה.', instructions: ['ציור סולם 1-10', 'מיקום סיטואציות', 'ניתוח השפעה'] },
                { id: 5, title: 'איים של מרחב אישי', story: 'לכל אדם יש מרחב פיזי ורגשי שזקוק להגנה.', question: 'איך שומרים על מרחב?', activity: 'פעילות תנועתית למעגלי מרחב.', instructions: ['תנועה בחדר', 'יצירת אי בטוח דמיוני', 'דיון קבוצתי'] },
                { id: 6, title: 'כתיבת מכתב לדמות פנימית', story: 'לעיתים פועלת בתוכנו דמות שדורשת שנרצה את כולם.', question: 'מה תאמר לדמות זו?', activity: 'כתיבת מכתב אישי.', instructions: ['כתיבה ישירה', 'תיאור העייפות', 'הגדרת גבול'] },
                { id: 7, title: 'ניתוח מקרה אמת (Case Study)', story: 'בדיון בקבוצת ווטסאפ מפעילים לחץ חברתי.', question: 'איך מייצרים גבול חברתי מול קבוצה?', activity: 'ניתוח דילמות חברתיות.', instructions: ['חלוקת כרטיסי אירוע', 'ניתוח נקודות מבט', 'גיבוש פתרון'] },
                { id: 8, title: 'סדנת משפטי מפתח בגוף ראשון', story: 'כשאנו כועסים אנו משתמשים בשפת האשמה.', question: 'איך עוברים לשפת האני?', activity: 'המרת משפטי האשמה.', instructions: ['קבלת רשימת משפטים', 'הוצאת האשמה', 'בנייה מחדש'] },
                { id: 9, title: 'עצירת חירום: לומר אני חושבת על זה', story: 'הרבה פעמים אומרים כן מהיר מתוך לחץ.', question: 'למה מילת ההשהיה חשובה?', activity: 'אימון על תגובות השהיה.', instructions: ['תרגול משפטי השהיה', 'הדגמה מול כיתה', 'כתיבת פתק אישי'] },
                { id: 10, title: 'עקביות ועמידה על משמר הגבול', story: 'הצד השני ממשיך ללחוץ למרות שאמרנו לא.', question: 'מה עושים מול לחץ חוזר?', activity: 'טכניקת התקליט השרוט.', instructions: ['הצגת הכלל', 'חזרה שקטה ועקבית', 'התמודדות עם שכנועים'] },
                { id: 11, title: 'הפרדת התנהגות מזהות האדם', story: 'כשמסרבים לבקשה מרגישים דחייה אישית.', question: 'איך זוכרים שסירוב אינו דחייה?', activity: 'פעילות הפרדה ויזואלית.', instructions: ['ציור מעגלים', 'דוגמאות אישיות', 'הסקת מסקנות'] },
                { id: 12, title: 'שעת סיפור והזדהות רגשית', story: 'בספרות פוגשים גיבורים המתמודדים עם ריצוי.', question: 'מה נלמד על החיים בכיתה?', activity: 'ניתוח קטעים מספרות.', instructions: ['הקראה מודטת', 'עבודה קבוצתית', 'כתיבת תובנה'] },
                { id: 13, title: 'קולאז׳ הערך העצמי שלי', story: 'ערך עצמי תלוי בהכרה פנימית ולא באישור חיצוני.', question: 'מה מזין את הערך שלך?', activity: 'יצירת לוח השראה חזותי.', instructions: ['גזירות ומילים', 'הדבקת חוזקות', 'הוספת כותרת'] },
                { id: 14, title: 'דיבייט: נדיבות מול הקרבה עצמית', story: 'האם צריך תמיד לוותר למען האחר?', question: 'האם גבול פוגעת בנדיבות?', activity: 'דיון כיתתי (דיבייט).', instructions: ['חלוקה לשתי קבוצות', 'הכנת טיעונים', 'קיום דיבייט'] },
                { id: 15, title: 'יומן אישי ותוכנית פעילות שבועית', story: 'הדרך להפוך ידע לפעולה עוברת בצעדים קטנים.', question: 'מהו גבול שתציב השבוע?', activity: 'הגדרת יעד ותוכנית אישית.', instructions: ['פתיחת דף ביומן', 'בחירת אתגר', 'כתיבת משפט מפתח'] }
            ];

            const dialogueCards = Array.from({ length: 30 }, (_, i) => ({
                id: i + 1,
                title: `קלף שיח #${i + 1}`,
                front: i % 2 === 0 ? `מתי בפעם האחרונה אמרת 'כן' למשהו שמאוד רצית לסרב לו?` : `מה הפחד הכי גדול שלך כשאתה חושב על לומר 'לא'?`,
                back: `הגוף משדר איתותים. ההכרה בכך והצבת גבול שקט הן הבסיס לבריאות נפשית.`
            }));

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
                    <header className="max-w-6xl mx-auto bg-gradient-to-r from-teal-600 to-cyan-700 text-white p-6 rounded-2xl shadow-xl mb-8 text-center">
                        <h1 className="text-3xl md:text-4xl font-extrabold mb-2">מרחב אינטראקטיבי: עקרונות גבולות בריאים וערך עצמי</h1>
                        <p className="text-teal-100 text-base">פותח על ידי רוית ראש בן ישי | מבוסס על "עקרונות פסיכולוגיים להצבת גבולות" מאת ד"ר מיכל וייס</p>
                    </header>

                    <nav className="max-w-6xl mx-auto flex flex-wrap justify-center gap-2 mb-8">
                        {[
                            { id: 'intro', label: '🚪 מהו גבול?' },
                            { id: 'activities', label: '📋 פעילויות לכיתה (15)' },
                            { id: 'cards', label: '🃏 קלפי שיח (30)' },
                            { id: 'games', label: '🎮 משחקים אינטראקטיביים' },
                        ].map((tab) => (
                            <button
                                key={tab.id}
                                onClick={() => { setActiveTab(tab.id); setSelectedActivity(null); if (tab.id === 'games') setActiveGameSubTab('hub'); }}
                                className={`px-5 py-3 rounded-xl font-bold transition-all shadow-md ${activeTab === tab.id ? 'bg-teal-700 text-white scale-105' : 'bg-white text-slate-700 hover:bg-slate-100'}`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="max-w-6xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-slate-100 min-h-[500px]">
                        {activeTab === 'intro' && (
                            <div className="max-w-4xl mx-auto space-y-6">
                                <h2 className="text-3xl font-extrabold text-teal-900">מהו גבול? מתי הוא נחצה?</h2>
                                <p className="text-slate-700 leading-relaxed">דמיינו מדינה ללא גבולות גיאוגרפיים – אין שערים ואין סימונים. האם מדינה כזו תוכל להתקיים? כך בדיוק לכל אדם יש מרחב אישי שזקוק לגבולות ברורים כדי לפרוח בביטחון.</p>
                            </div>
                        )}

                        {activeTab === 'activities' && !selectedActivity && (
                            <div>
                                <h2 className="text-2xl font-bold text-teal-800 mb-6">15 פעילויות מקיפות לכיתה</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activitiesList.map(act => (
                                        <div key={act.id} onClick={() => setSelectedActivity(act)} className="bg-slate-50 border p-5 rounded-xl cursor-pointer hover:border-teal-400 flex flex-col justify-between">
                                            <div>
                                                <span className="bg-teal-100 text-teal-800 text-xs px-2.5 py-1 rounded-full font-bold">פעילות #{act.id}</span>
                                                <h3 className="font-bold text-teal-700 text-lg mt-3 mb-2">{act.title}</h3>
                                                <p className="text-slate-600 text-sm line-clamp-2">{act.story}</p>
                                            </div>
                                            <span className="mt-4 text-xs text-teal-600 font-semibold">לחץ לצפייה בכרטיס המלא ←</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'activities' && selectedActivity && (
                            <div className="max-w-3xl mx-auto bg-slate-50 p-6 rounded-2xl border-2 border-teal-200">
                                <button onClick={() => setSelectedActivity(null)} className="mb-6 bg-slate-200 px-4 py-2 rounded-xl font-bold text-sm">← חזרה לכל הפעילויות</button>
                                <h2 className="text-2xl font-extrabold text-teal-900 mb-4">פעילות #{selectedActivity.id}: {selectedActivity.title}</h2>
                                <div className="bg-teal-50 p-4 rounded-xl mb-4"><strong>סיפור מסגרת:</strong> {selectedActivity.story}</div>
                                <div className="bg-cyan-50 p-4 rounded-xl mb-4"><strong>שאלה לדיון:</strong> {selectedActivity.question}</div>
                                <div className="bg-white p-4 rounded-xl border mb-4"><strong>מטרה:</strong> {selectedActivity.activity}</div>
                                <div className="bg-white p-4 rounded-xl border">
                                    <strong>הוראות ביצוע:</strong>
                                    <ul className="list-disc list-inside mt-2 space-y-1 text-sm">
                                        {selectedActivity.instructions.map((ins, i) => <li key={i}>{ins}</li>)}
                                    </ul>
                                </div>
                            </div>
                        )}

                        {activeTab === 'cards' && (
                            <div>
                                <h2 className="text-2xl font-bold text-teal-800 mb-6">קלפי שיח אינטראקטיביים (30 קלפים)</h2>
                                <div className="flex justify-center my-8">
                                    <div onClick={() => setIsFlipped(!isFlipped)} className={`w-full max-w-lg h-72 rounded-2xl shadow-xl p-8 flex flex-col justify-between cursor-pointer transition-all ${isFlipped ? 'bg-cyan-900 text-white' : 'bg-teal-50 border-2 border-teal-300'}`}>
                                        <div className="flex justify-between text-xs opacity-70"><span>{dialogueCards[currentCardIndex].title}</span><span>{isFlipped ? '💡 תובנה' : '❓ שאלה'}</span></div>
                                        <div className="text-center my-auto"><p className="text-xl font-bold">{isFlipped ? dialogueCards[currentCardIndex].back : dialogueCards[currentCardIndex].front}</p></div>
                                        <div className="text-center text-xs opacity-60">לחץ על הקלף כדי להפוך</div>
                                    </div>
                                </div>
                                <div className="flex gap-2 overflow-x-auto pb-2">
                                    {dialogueCards.map((c, idx) => (
                                        <button key={c.id} onClick={() => { setCurrentCardIndex(idx); setIsFlipped(false); }} className={`px-3 py-1.5 rounded-lg text-sm font-bold shrink-0 ${currentCardIndex === idx ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-700'}`}>{c.id}</button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'games' && (
                            <div>
                                {activeGameSubTab === 'hub' && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div onClick={() => setActiveGameSubTab('sorting')} className="bg-teal-50 border-2 border-teal-200 p-6 rounded-2xl cursor-pointer hover:shadow-lg">
                                            <h3 className="text-xl font-bold text-teal-900 mb-2">⚡ מיון מהיר</h3>
                                            <p className="text-slate-600 text-sm">מיין התנהגויות ל"שומרים על הגבול" או "חוצים".</p>
                                        </div>
                                        <div onClick={() => setActiveGameSubTab('wall')} className="bg-teal-50 border-2 border-teal-200 p-6 rounded-2xl cursor-pointer hover:shadow-lg">
                                            <h3 className="text-xl font-bold text-teal-900 mb-2">🧱 חומת הגבולות</h3>
                                            <p className="text-slate-600 text-sm">בנה את חומת המגן על ידי ניחוש מושגי מפתח.</p>
                                        </div>
                                        <div onClick={() => setActiveGameSubTab('wheel')} className="bg-teal-50 border-2 border-teal-200 p-6 rounded-2xl cursor-pointer hover:shadow-lg">
                                            <h3 className="text-xl font-bold text-teal-900 mb-2">🎡 גלגל המזל</h3>
                                            <p className="text-slate-600 text-sm">קבל דילמה חברתית ובחר את התגובה הנכונה.</p>
                                        </div>
                                    </div>
                                )}

                                {activeGameSubTab === 'sorting' && (
                                    <div>
                                        <button onClick={() => setActiveGameSubTab('hub')} className="mb-4 bg-slate-200 px-4 py-2 rounded-xl font-bold text-sm">← חזרה לתפריט</button>
                                        <div className="max-w-xl mx-auto bg-slate-50 p-6 rounded-2xl border text-center">
                                            <h3 className="text-xl font-bold mb-4">מיון מהיר (60 שניות)</h3>
                                            {!sortingActive ? (
                                                <button onClick={() => setSortingActive(true)} className="bg-teal-600 text-white px-8 py-3 rounded-xl font-bold">התחל משחק 🚀</button>
                                            ) : (
                                                <div>
                                                    <p className="text-lg font-bold mb-6">"{sortingCardsData[sortingIndex % sortingCardsData.length].text}"</p>
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <button onClick={() => handleSortChoice('inside')} className="bg-green-600 text-white p-4 rounded-xl font-bold">🟢 שומרים</button>
                                                        <button onClick={() => handleSortChoice('outside')} className="bg-red-600 text-white p-4 rounded-xl font-bold">🔴 חוצים</button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {activeGameSubTab === 'wall' && (
                                    <div>
                                        <button onClick={() => setActiveGameSubTab('hub')} className="mb-4 bg-slate-200 px-4 py-2 rounded-xl font-bold text-sm">← חזרה לתפריט</button>
                                        <div className="max-w-xl mx-auto bg-slate-50 p-6 rounded-2xl border text-center">
                                            <h3 className="text-xl font-bold mb-2">חומת הגבולות</h3>
                                            <p className="text-sm text-slate-600 mb-4">{currentWordObj.hint}</p>
                                            <div className="text-3xl font-mono tracking-widest font-bold my-6">
                                                {currentWordObj.word.split('').map(c => guessedLetters.includes(c) ? c : '_').join(' ')}
                                            </div>
                                            <div className="flex flex-wrap justify-center gap-1">
                                                {'אבגדהוזחטיכלמנסעפצקרשת'.split('').map(l => (
                                                    <button key={l} disabled={guessedLetters.includes(l)} onClick={() => handleLetterGuess(l)} className="w-9 h-9 bg-white border rounded font-bold hover:bg-teal-50 disabled:bg-slate-200">{l}</button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeGameSubTab === 'wheel' && (
                                    <div>
                                        <button onClick={() => setActiveGameSubTab('hub')} className="mb-4 bg-slate-200 px-4 py-2 rounded-xl font-bold text-sm">← חזרה לתפריט</button>
                                        <div className="max-w-xl mx-auto bg-slate-50 p-6 rounded-2xl border text-center">
                                            <h3 className="text-xl font-bold mb-2">גלגל המזל של הדילמות</h3>
                                            <p className="text-slate-700 my-4">{wheelDilemmas[currentWheelIndex].situation}</p>
                                            <div className="space-y-2">
                                                {wheelDilemmas[currentWheelIndex].options.map((opt, oIdx) => (
                                                    <button key={oIdx} onClick={() => setWheelResult(opt)} className="w-full p-3 bg-white border rounded-xl text-right font-medium text-sm hover:border-teal-400">{opt.text}</button>
                                                ))}
                                            </div>
                                            {wheelResult && <div className="mt-4 p-3 bg-teal-50 rounded-xl font-bold text-sm">{wheelResult.feedback}</div>}
                                            <button onClick={() => { setCurrentWheelIndex((currentWheelIndex + 1) % wheelDilemmas.length); setWheelResult(null); }} className="mt-6 bg-teal-600 text-white px-4 py-2 rounded-xl text-xs font-bold">דילמה הבאה 🔄</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
