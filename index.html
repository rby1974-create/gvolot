<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מרחב אינטראקטיבי: עקרונות גבולות בריאים וערך עצמי</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('presentation');
            const [selectedActivity, setSelectedActivity] = React.useState(null);
            const [activeGameSubTab, setActiveGameSubTab] = React.useState('hub');
            
            // Wall / Hangman state
            const wallWords = [
                { word: 'הקשבה', hint: 'מה שאנחנו צריכים לעשות כשהמורה או חבר מדברים בשיעור', category: 'בית ספר וכיתה' },
                { word: 'מרחב אישי', hint: 'המרחק הפיזי סביב הגוף שלי, שאף אחד לא אמור להיכנס אליו בלי רשותי', category: 'בית ספר וכיתה' },
                { word: 'סבלנות', hint: 'התכונה שנעזרים בה כשצריך לחכות בתור או להרים יד ולחכות שיקראו בשמנו', category: 'בית ספר וכיתה' },
                { word: 'בקשת רשות', hint: 'שתי מילים שחובה להגיד לפני שלוקחים משהו שלא שייך לנו', category: 'בית ספר וכיתה' },
                { word: 'חברות', hint: 'קשר טוב בין ילדים, שמבוסס על כבוד הדדי ולא חוצה גבולות של פגיעה או העלבה', category: 'בית ספר וכיתה' },
                { word: 'פרטיות', hint: 'הזכות של אבא, אמא או האחים שלי להיות לבד בחדר שלהם בלי שיפריעו להם', category: 'בית ומשפחה' },
                { word: 'חוקי הבית', hint: 'הכללים שנקבעו יחד עם ההורים כדי שהבית יהיה מסודר, בטוח ונעים לכולם', category: 'בית ומשפחה' },
                { word: 'זמן מסך', hint: 'הגבול שמגדיר כמה שעות ביום מותר לנו להיות מול הטאבלט, הטלוויזיה או הטלפון', category: 'בית ומשפחה' },
                { word: 'בטיחות', hint: 'הסיבה המרכזית שבגללה ההורים מציבים לנו גבולות (כמו לא לגעת בחשמל או באש)', category: 'בית ומשפחה' },
                { word: 'כבוד הורי', hint: 'הדרך שבה אנחנו מתייחסים להורים שלנו, גם כשהם אומרים לנו "לא" או מציבים גבול', category: 'בית ומשפחה' }
            ];
            const [wallIndex, setWallIndex] = React.useState(0);
            const [guessedLetters, setGuessedLetters] = React.useState([]);
            const [wallMistakes, setWallMistakes] = React.useState(0);

            const currentWordObj = wallWords[wallIndex];
            const handleLetterGuess = (letter) => {
                if (guessedLetters.includes(letter)) return;
                setGuessedLetters([...guessedLetters, letter]);
                if (!currentWordObj.word.includes(letter)) {
                    setWallMistakes(prev => prev + 1);
                }
            };

            const resetWallGame = () => {
                setGuessedLetters([]);
                setWallMistakes(0);
                setWallIndex((prev) => (prev + 1) % wallWords.length);
            };

            // Sorting Game State
            const sortingCardsData = [
                { text: 'לבקש רשות מהחבר לפני שלוקחים לו משהו מהשולחן', category: 'inside' },
                { text: 'להתפרץ לדברי המורה בזמן שהיא מסבירה את החומר', category: 'outside' },
                { text: 'לשחק בטלפון הנייד מתחת לשולחן בזמן השיעור', category: 'outside' },
                { text: 'לעמוד בתור לקפיטריה בלי לדחוף או לעקוף', category: 'inside' },
                { text: 'להמשיך להציק לחבר אחרי שהוא אמר בבירור "די, תפסיק!"', category: 'outside' },
                { text: 'להרים יד ולחכות שיקראו בשמי לפני שאני עונה', category: 'inside' },
                { text: 'לזרוק עטיפת חטיף על הרצפה בחצר ולא בפח', category: 'outside' },
                { text: 'להזמין למשחק חבר שיושב לבד בצד בהפסקה', category: 'inside' },
                { text: 'לדפוק על הדלת של החדר של אמא ואבא לפני שנכנסים', category: 'inside' },
                { text: 'להמשיך לשחק בטאבלט למרות שאמא אמרה שזמן המסכים נגמר', category: 'outside' },
                { text: 'לשים את הנעליים והתיק במקום מיד כשנכנסים הביתה', category: 'inside' },
                { text: 'לפתוח את המקרר ולקחת ממתק בלי לשאול אם מותר לפני ארוחת ערב', category: 'outside' }
            ];
            const [sortingIndex, setSortingIndex] = React.useState(0);
            const [sortingScore, setSortingScore] = React.useState(0);
            const [sortingTimer, setSortingTimer] = React.useState(60);
            const [sortingActive, setSortingActive] = React.useState(false);
            const [sortingFeedback, setSortingFeedback] = React.useState(null);

            React.useEffect(() => {
                let interval = null;
                if (sortingActive && sortingTimer > 0) {
                    interval = setInterval(() => {
                        setSortingTimer((prev) => prev - 1);
                    }, 1000);
                } else if (sortingTimer === 0) {
                    setSortingActive(false);
                }
                return () => clearInterval(interval);
            }, [sortingActive, sortingTimer]);

            const handleSortChoice = (choice) => {
                if (!sortingActive) return;
                const currentCard = sortingCardsData[sortingIndex % sortingCardsData.length];
                if (choice === currentCard.category) {
                    setSortingScore(prev => prev + 1);
                    setSortingFeedback({ correct: true, text: 'כל הכבוד! תשובה נכונה.' });
                } else {
                    setSortingTimer(prev => Math.max(0, prev - 3));
                    setSortingFeedback({ correct: false, text: 'טעות! הזמן התקצר ב-3 שניות.' });
                }
                setTimeout(() => {
                    setSortingFeedback(null);
                    setSortingIndex(prev => prev + 1);
                }, 800);
            };

            // Wheel of Fortune / Dilemmas state
            const wheelDilemmas = [
                {
                    title: 'דילמת רכוש וחפצים',
                    situation: 'חזרת מההפסקה וגילית שחבר מהכיתה לקח לך את הטושים החדשים מהשולחן והתחיל לצבוע איתם, בלי לבקש רשות.',
                    options: [
                        { text: 'לחטוף לו את הטושים מהיד ולצעוק עליו בפני כולם.', correct: false, points: 0, feedback: '🔴 חציית גבול! תוקפנות יוצרת מלחמה חדשה.' },
                        { text: 'לא להגיד כלום, להתעצב בצד ולחכות שהוא יסיים.', correct: false, points: 5, feedback: '🟡 וויתור על הגבול שלך. השתיקה מובילה לתסכול.' },
                        { text: 'לגשת אליו ולומר ברוגע: "הטושים האלו שלי, בבקשה תחזיר לי אותם. פעם הבאה תבקש ואשמח להשאיל לך".', correct: true, points: 10, feedback: '🟢 הצבת גבול מכבדת ואסרטיבית!' }
                    ]
                },
                {
                    title: 'דילמת המרחב האישי',
                    situation: 'בזמן העמידה בתור לשיעור ספורט, ילד מהכיתה עומד קרוב מדי אליך, נצמד אליך ודוחף קצת, למרות שזה ממש לא נעים לך.',
                    options: [
                        { text: 'להסתובב אליו, לעשות צעד קטן לאחור ולומר: "אתה עומד קרוב מדי וזה מפריע לי, בבקשה תשמור על מרחב אישי".', correct: true, points: 10, feedback: '🟢 הצבת גבול מכבדת ובריאה!' },
                        { text: 'לדחוף אותו חזרה חזק כדי שילמד לקח.', correct: false, points: 0, feedback: '🔴 חציית גבול! תגובה פיזית תוקפנית.' },
                        { text: 'לסבול בשקט ולנסות להצטמק כדי לא להפריע לו.', correct: false, points: 5, feedback: '🟡 וויתור מוחלט על המרחב והגוף שלך.' }
                    ]
                }
            ];
            const [currentWheelIndex, setCurrentWheelIndex] = React.useState(0);
            const [wheelResult, setWheelResult] = React.useState(null);

            // Escape Room State
            const [escapeRoomStage, setEscapeRoomStage] = React.useState(1);
            const [room1Items, setRoom1Items] = React.useState({ socks: false, juice: false, charger: false });
            const [room2Actions, setRoom2Actions] = React.useState({ student1: false, student2: false, student3: false });
            const [room2CodeInput, setRoom2CodeInput] = React.useState('');
            const [room2Unlocked, setRoom2Unlocked] = React.useState(false);
            const [room2Error, setRoom2Error] = React.useState('');
            const [room3BorderDrawn, setRoom3BorderDrawn] = React.useState(false);
            const [room3Rules, setRoom3Rules] = React.useState({ rule1: false, rule2: false, rule3: false });

            // Cards state
            const [currentCardIndex, setCurrentCardIndex] = React.useState(0);
            const [isFlipped, setIsFlipped] = React.useState(false);

            // Lotto state
            const [lottoChecked, setLottoChecked] = React.useState({});

            const activitiesList = [
                { id: 1, title: 'מיפוי הקול הפנימי', story: 'דנה יושבת בחדר ומרגישה שחברה מהכיתה מבקשת ממנה שוב להכין במקומה את העבודה...', question: 'אילו קולות פנימיים עולים בך?', activity: 'זיהוי מחשבות מעכבות.', instructions: ['חלוקה לטורים', 'רישום משפטים', 'שיתוף'] }
            ];

            const dialogueCards = Array.from({ length: 10 }, (_, i) => ({
                id: i + 1,
                title: `קלף שיח #${i + 1}`,
                front: `מתי בפעם האחרונה אמרת 'כן' למשהו שרצית לסרב לו?`,
                back: `הגוף משדר איתותים. ההכרה בכך היא הצעד הראשון.`
            }));

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
                    <header className="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-xl mb-8 text-center border border-slate-100">
                        <div className="relative w-full pt-[54.5455%] shadow-sm mb-4 overflow-hidden rounded-lg bg-slate-100">
                            <iframe className="absolute inset-0 w-full h-full border-none" src="https://www.canva.com/design/DAHRlnRq-iI/04mh_dCbpOYW7_BRs4nvHg/view?embed" allowFullScreen></iframe>
                        </div>
                        <div className="text-xs text-slate-500 mb-4">עיצוב על ידי רוית ראש</div>
                        <div className="bg-gradient-to-r from-teal-600 to-cyan-700 text-white p-6 rounded-2xl shadow-md">
                            <h1 className="text-3xl md:text-4xl font-extrabold mb-2">מרחב אינטראקטיבי: עקרונות גבולות בריאים וערך עצמי</h1>
                            <p className="text-teal-100 text-base">פותח על ידי רוית ראש בן ישי | מבוסס על "עקרונות פסיכולוגיים להצבת גבולות" מאת ד"ר מיכל וייס</p>
                        </div>
                    </header>

                    <nav className="max-w-6xl mx-auto flex flex-wrap justify-center gap-2 mb-8">
                        {[
                            { id: 'presentation', label: '📊 מצגת מלווה למורים' },
                            { id: 'intro', label: '🚪 מהו גבול?' },
                            { id: 'activities', label: '📋 פעילויות לכיתה' },
                            { id: 'cards', label: '🃏 קלפי שיח' },
                            { id: 'games', label: '🎮 משחקים אינטראקטיביים' },
                        ].map((tab) => (
                            <button
                                key={tab.id}
                                onClick={() => { setActiveTab(tab.id); setSelectedActivity(null); if (tab.id === 'games') setActiveGameSubTab('hub'); }}
                                className={`px-5 py-3 rounded-xl font-bold transition-all shadow-md ${activeTab === tab.id ? 'bg-teal-700 text-white scale-105' : 'bg-white text-slate-700 hover:bg-slate-100'}`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="max-w-6xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-slate-100 min-h-[500px]">
                        {activeTab === 'presentation' && (
                            <div className="max-w-4xl mx-auto space-y-6">
                                <h2 className="text-3xl font-extrabold text-teal-900">📊 מצגת מלווה למורים</h2>
                                <div className="relative w-full pt-[55.8342%] overflow-hidden rounded-lg bg-slate-100 shadow">
                                    <iframe className="absolute inset-0 w-full h-full border-none" src="https://www.canva.com/design/DAHRluLiDV0/pzgnlFwNamvTgt3FjffKsw/view?embed" allowFullScreen></iframe>
                                </div>
                            </div>
                        )}

                        {activeTab === 'intro' && (
                            <div className="max-w-4xl mx-auto space-y-6">
                                <h2 className="text-3xl font-extrabold text-teal-900">מהו גבול? מתי הוא נחצה?</h2>
                                <p className="text-slate-700 leading-relaxed">דמיינו מדינה ללא גבולות... כך בדיוק לכל אדם יש מרחב אישי שזקוק לגבולות ברורים כדי לפרוח.</p>
                            </div>
                        )}

                        {activeTab === 'activities' && !selectedActivity && (
                            <div>
                                <h2 className="text-2xl font-bold text-teal-800 mb-6">פעילויות לכיתה</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activitiesList.map(act => (
                                        <div key={act.id} onClick={() => setSelectedActivity(act)} className="bg-slate-50 border p-5 rounded-xl cursor-pointer hover:border-teal-400">
                                            <h3 className="font-bold text-teal-700 text-lg">{act.title}</h3>
                                            <p className="text-slate-600 text-sm mt-2">{act.story}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'cards' && (
                            <div>
                                <h2 className="text-2xl font-bold text-teal-800 mb-6">קלפי שיח אינטראקטיביים</h2>
                                <div className="flex justify-center my-8">
                                    <div onClick={() => setIsFlipped(!isFlipped)} className={`w-full max-w-lg h-72 rounded-2xl shadow-xl p-8 flex flex-col justify-between cursor-pointer transition-all ${isFlipped ? 'bg-cyan-900 text-white' : 'bg-teal-50 border-2 border-teal-300'}`}>
                                        <div className="text-center my-auto">
                                            <p className="text-xl font-bold">{isFlipped ? dialogueCards[currentCardIndex].back : dialogueCards[currentCardIndex].front}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'games' && (
                            <div>
                                <div className="mb-8 p-4 bg-slate-50 rounded-2xl border text-center">
                                    <div className="relative w-full pt-[54.5455%] overflow-hidden rounded-lg bg-slate-100">
                                        <iframe className="absolute inset-0 w-full h-full border-none" src="https://www.canva.com/design/DAHRlofTwEk/Ubm3u_obwOlnqnjrlciVhw/view?embed" allowFullScreen></iframe>
                                    </div>
                                </div>
                                {activeGameSubTab === 'hub' && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div onClick={() => setActiveGameSubTab('sorting')} className="bg-teal-50 border-2 border-teal-200 p-6 rounded-2xl cursor-pointer hover:shadow-lg">
                                            <h3 className="text-xl font-bold text-teal-900 mb-2">⚡ מיון מהיר</h3>
                                            <p className="text-slate-600 text-sm">מיין התנהגויות ל"שומרים על הגבול" או "חוצים".</p>
                                        </div>
                                        <div onClick={() => setActiveGameSubTab('wall')} className="bg-teal-50 border-2 border-teal-200 p-6 rounded-2xl cursor-pointer hover:shadow-lg">
                                            <h3 className="text-xl font-bold text-teal-900 mb-2">🧱 חומת הגבולות</h3>
                                            <p className="text-slate-600 text-sm">בנה את חומת המגן על ידי ניחוש מושגי מפתח.</p>
                                        </div>
                                        <div onClick={() => setActiveGameSubTab('wheel')} className="bg-teal-50 border-2 border-teal-200 p-6 rounded-2xl cursor-pointer hover:shadow-lg">
                                            <h3 className="text-xl font-bold text-teal-900 mb-2">🎡 גלגל המזל</h3>
                                            <p className="text-slate-600 text-sm">קבל דילמה חברתית ובחר את התגובה הנכונה.</p>
                                        </div>
                                    </div>
                                )}

                                {activeGameSubTab === 'sorting' && (
                                    <div>
                                        <button onClick={() => setActiveGameSubTab('hub')} className="mb-4 bg-slate-200 px-4 py-2 rounded-xl font-bold text-sm">← חזרה</button>
                                        <div className="max-w-xl mx-auto bg-slate-50 p-6 rounded-2xl border text-center">
                                            <h3 className="text-xl font-bold mb-4">מיון מהיר (60 שניות)</h3>
                                            {!sortingActive ? (
                                                <button onClick={() => setSortingActive(true)} className="bg-teal-600 text-white px-8 py-3 rounded-xl font-bold">התחל משחק 🚀</button>
                                            ) : (
                                                <div>
                                                    <p className="text-lg font-bold mb-6">"{sortingCardsData[sortingIndex % sortingCardsData.length].text}"</p>
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <button onClick={() => handleSortChoice('inside')} className="bg-green-600 text-white p-4 rounded-xl font-bold">🟢 שומרים</button>
                                                        <button onClick={() => handleSortChoice('outside')} className="bg-red-600 text-white p-4 rounded-xl font-bold">🔴 חוצים</button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
